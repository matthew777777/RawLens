org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# AGP 9 defaults to the new DSL, which drops applicationVariants. The APK
# rename (RawLens-<ver>-<type>.apk in outputs/apk/<flavor>/<type>/) is matched
# by the in-app updater (GitHub release asset names); Google's replacement (listenToArtifacts)
# writes to a different directory, so keep the legacy DSL until that path
# is migrated. Removed in AGP 10.
# https://developer.android.com/build/releases/agp-9-0-0-release-notes
android.newDsl=false
# AGP 9 flips this to true; app sets testBuildType = "release" (for
# on-device perf), which would drop testDebugUnitTest. Keep the 1.x
# unit-test surface.
android.onlyEnableUnitTestForTheTestedBuildType=false
# Build performance: independent modules (:app, :tools:sr-pipeline) and
# cacheable tasks (R8, AAPT2, CMake) build in parallel / from cache.
org.gradle.parallel=true
org.gradle.caching=true
# Non-transitive R classes: smaller R classes, faster dexing. Default
# on in AGP 9; pinned so an AGP change cannot silently regress it.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
