org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# AGP 9 defaults to the new DSL, which drops applicationVariants. The APK
# rename (RawLens-<ver>-<type>.apk in outputs/apk/<type>/) is consumed by the
# F-Droid recipe (docs/fdroid.md); Google's replacement (listenToArtifacts)
# writes to a different directory, so keep the legacy DSL until that path
# is migrated. Removed in AGP 10.
# https://developer.android.com/build/releases/agp-9-0-0-release-notes
android.newDsl=false
# AGP 9 flips this to true; app sets testBuildType = "release" (for
# on-device perf), which would drop testDebugUnitTest. Keep the 1.x
# unit-test surface.
android.onlyEnableUnitTestForTheTestedBuildType=false
