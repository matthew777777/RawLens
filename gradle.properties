org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# AGP 9 flips this to true; app sets testBuildType = "deviceTest" (for
# on-device perf), which would drop debug unit tests. Keep unit tests
# available for every build type.
android.onlyEnableUnitTestForTheTestedBuildType=false
# Build performance: independent modules (:app, :tools:sr-pipeline) and
# cacheable tasks (R8, AAPT2, CMake) build in parallel / from cache.
org.gradle.parallel=true
org.gradle.caching=true
# Non-transitive R classes: smaller R classes, faster dexing. Default
# on in AGP 9; pinned so an AGP change cannot silently regress it.
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
